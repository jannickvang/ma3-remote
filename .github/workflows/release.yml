name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:exe
      - name: Zip per platform
        run: |
          cd dist
          for f in ma3-remote-pwa-*; do
            case "$f" in
              *.exe) zip "${f%.exe}.zip" "$f" ;;
              *) tar czf "$f.tar.gz" "$f" ;;
            esac
          done
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
