<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MA3 Remote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MA3 Remote">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="topbar">
    <nav id="nav">
      <button class="nav-btn active" data-page="encoders">Encoders</button>
      <button class="nav-btn" data-page="shapers">Shapers</button>
      <button class="nav-btn" data-page="fixtures">Fixtures</button>
    </nav>
    <button id="conn" class="conn off" title="Open settings"><span class="dot"></span><span id="conn-text">Offline</span><span class="gear">⚙</span></button>
  </header>

  <main id="pages">
    <!-- ENCODERS -->
    <section class="page active" id="page-encoders">
      <div class="enc-layout">
        <div class="enc-side" id="wheel-pan"></div>
        <div class="enc-middle" id="wheels-middle">
          <div class="frost-presets" id="frost-presets">
            <div class="wheel-label">Frost</div>
            <div class="frost-buttons"></div>
          </div>
        </div>
        <div class="enc-side" id="wheel-tilt"></div>
      </div>
    </section>

    <!-- SHAPERS -->
    <section class="page" id="page-shapers">
      <div class="shaper-grid" id="shaper-grid"></div>
    </section>

    <!-- FIXTURES -->
    <section class="page" id="page-fixtures">
      <div class="fix-layout">
        <div class="panel">
          <h2>Selection</h2>
          <div class="segmented" id="sel-mode">
            <button class="seg active" data-mode="fixture">Fixture</button>
            <button class="seg" data-mode="group">Group</button>
          </div>
          <input type="text" id="sel-input" inputmode="decimal" autocomplete="off" placeholder="e.g. 1 thru 8 + 12">
          <div class="keypad" id="keypad"></div>
          <div class="row">
            <button class="btn accent" id="sel-apply">Select</button>
            <button class="btn" id="sel-clear">Clear field</button>
          </div>
        </div>
        <div class="panel grow">
          <h2>Groups <span class="sub">Datapool 2</span></h2>
          <div class="row">
            <span id="groups-status" class="hint">Open this page to load the groups from the MA3.</span>
            <button class="btn" id="groups-refresh">Refresh</button>
          </div>
          <div class="group-grid scrollable" id="group-grid"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="bottombar">
    <div id="bar-buttons"></div>
  </footer>

  <dialog id="config-dialog">
    <h2>Settings</h2>
    <section class="settings-section">
      <h3>MA3 connection</h3>
      <p id="ma3-state" class="hint"></p>
      <div class="row">
        <label>IP address / hostname <input type="text" id="ma3-ip" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="127.0.0.1"></label>
        <label>Port <input type="number" id="ma3-port" inputmode="numeric" min="1" max="65535" value="8000"></label>
      </div>
      <div class="row">
        <button class="btn" id="ma3-local">This computer</button>
        <button class="btn accent" id="ma3-save">Save connection</button>
      </div>
      <p id="ma3-error" class="error"></p>
    </section>
    <section class="settings-section">
      <h3>Frost presets</h3>
      <p class="hint">Set the MA3 preset number for each frost button.</p>
    <div class="frost-config" id="frost-config"></div>
    <p id="frost-error" class="error"></p>
    <div class="row end">
      <button class="btn accent" id="frost-save">Save frost</button>
    </div>
    </section>
    <section class="settings-section">
      <h3>Bottom button bar</h3>
      <ul id="config-list"></ul>
      <div class="row">
        <input type="text" id="custom-label" placeholder="Label" maxlength="12">
        <input type="text" id="custom-cmd" placeholder="MA3 command, e.g. Go+ Sequence 1" maxlength="150">
        <button class="btn" id="custom-add">Add</button>
      </div>
      <div class="row">
        <button class="btn" id="config-reset">Default bar</button>
      </div>
    </section>
    <section class="settings-section">
      <h3>This client</h3>
      <div class="row">
        <label>Client name <input type="text" id="client-name" maxlength="60" placeholder="Optional name"></label>
        <button class="btn" id="client-name-save">Save name</button>
      </div>
      <ul id="client-list"></ul>
    </section>
    <div class="row end">
      <button class="btn accent" id="config-close">Done</button>
    </div>
  </dialog>

  <script src="/js/encoders.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
